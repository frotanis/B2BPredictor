services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2bpredictor-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/app/data/b2bpredictor.db;Foreign Keys=True"
      Jwt__Issuer: "B2BPredictor"
      Jwt__Audience: "B2BPredictor.Client"
      Jwt__Key: "${JWT_KEY:-SuperSecretJwtKeyForDockerRun2026!}"
      Jwt__ExpiryMinutes: "60"
    volumes:
      - b2bpredictor_data:/app/data

volumes:
  b2bpredictor_data: